<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Radioterapia — Rozszerzony (120 pytań)</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #18202c;
      --muted: #5c687a;
      --accent: #1d5fd6;
      --accent-hover: #1549ab;
      --accent-soft: #eef4ff;
      --ok-bg: #eaf8f0;
      --ok-border: #1e8e5a;
      --ok-text: #135c39;
      --bad-bg: #fdeeee;
      --bad-border: #c93b3b;
      --bad-text: #841e1e;
      --border: #dde3ec;
      --radius: 12px;
      --shadow: 0 6px 24px rgba(24, 32, 44, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px 48px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }

    .rt-quiz-wrap {
      max-width: 820px;
      margin: 0 auto;
    }

    .rt-header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .rt-title-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    h1.rt-title {
      margin: 0;
      font-size: 1.35rem;
      line-height: 1.3;
    }

    .rt-badge {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .rt-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
    }

    select.rt-select {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font-size: 0.92rem;
      max-width: 100%;
    }

    button.rt-btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    button.rt-btn:hover:not(:disabled) {
      background: #f0f3f8;
    }

    button.rt-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.rt-btn.primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    button.rt-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .rt-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .rt-stats strong {
      color: var(--text);
    }

    .rt-progress-track {
      width: 100%;
      height: 7px;
      background: #e5eaf2;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }

    .rt-progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.25s ease;
    }

    .rt-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .rt-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .rt-question {
      font-size: 1.12rem;
      font-weight: 600;
      margin: 0 0 18px;
      color: var(--text);
    }

    .rt-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .rt-option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
      text-align: left;
      padding: 13px 15px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: #fff;
      color: var(--text);
      font-size: 0.96rem;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .rt-option:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .rt-option:disabled {
      cursor: default;
    }

    .rt-opt-key {
      flex: 0 0 auto;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      background: #eef2f7;
      color: var(--text);
      margin-top: 1px;
    }

    .rt-option.correct {
      background: var(--ok-bg);
      border-color: var(--ok-border);
      color: var(--ok-text);
    }

    .rt-option.correct .rt-opt-key {
      background: var(--ok-border);
      color: #fff;
    }

    .rt-option.wrong {
      background: var(--bad-bg);
      border-color: var(--bad-border);
      color: var(--bad-text);
    }

    .rt-option.wrong .rt-opt-key {
      background: var(--bad-border);
      color: #fff;
    }

    .rt-option.dimmed {
      opacity: 0.65;
    }

    .rt-feedback {
      margin-top: 18px;
      padding: 15px 17px;
      border-radius: 10px;
      border-left: 4px solid transparent;
      display: none;
    }

    .rt-feedback.show {
      display: block;
    }

    .rt-feedback.ok {
      background: var(--ok-bg);
      border-left-color: var(--ok-border);
      color: var(--ok-text);
    }

    .rt-feedback.bad {
      background: var(--bad-bg);
      border-left-color: var(--bad-border);
      color: var(--bad-text);
    }

    .rt-feedback-title {
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 1rem;
    }

    .rt-explanation {
      margin: 0;
      font-size: 0.94rem;
      color: var(--text);
    }

    .rt-footer-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .rt-summary {
      text-align: center;
      padding: 12px 4px;
    }

    .rt-summary h2 {
      margin: 0 0 8px;
      font-size: 1.3rem;
    }

    .rt-summary-score {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
      margin: 10px 0 16px;
    }
  </style>
</head>

          explanation: "Promieniowanie fotonowe to fala elektromagnetyczna przenoszona przez fotony (bez masy spoczynkowej i ładunku), np. X i γ; w klasyfikacji radiologicznej nie zalicza się go do promieniowania cząsteczkowego."
        }
      ];

      const LETTERS = ["A", "B", "C", "D"];

      let activePool = [...QUESTIONS];
      let currentIndex = 0;
      // Map question.id -> { chosenText: string, shuffledOptions: string[], isCorrect: boolean }
      let answersMap = new Map();

      const elSectionSelect = document.getElementById("rtSectionSelect");
      const elShuffleQuestionsBtn = document.getElementById("rtShuffleQuestionsBtn");
      const elRestartBtn = document.getElementById("rtRestartBtn");
      const elCard = document.getElementById("rtCard");
      const elTotalBadge = document.getElementById("rtTotalBadge");
      const elPosText = document.getElementById("rtPosText");
      const elAnsweredText = document.getElementById("rtAnsweredText");
      const elCorrectText = document.getElementById("rtCorrectText");
      const elAccuracyText = document.getElementById("rtAccuracyText");
      const elProgressBar = document.getElementById("rtProgressBar");

      function shuffleArray(arr) {
        const copy = arr.slice();
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function getFilteredQuestions() {
        const sec = elSectionSelect.value;
        if (sec === "ALL") return QUESTIONS.slice();
        return QUESTIONS.filter((item) => item.section === sec);
      }

      function startNewRound(shuffleQuestions) {
        activePool = getFilteredQuestions();
        if (shuffleQuestions) {
          activePool = shuffleArray(activePool);
        }
        currentIndex = 0;
        answersMap = new Map();
        render();
      }

      function getOrCreateShuffledOptions(qObj) {
        const existing = answersMap.get(qObj.id);
        if (existing && existing.shuffledOptions) {
          return existing.shuffledOptions;
        }
        const opts = shuffleArray([qObj.correct, ...qObj.distractors]);
        answersMap.set(qObj.id, {
          chosenText: null,
          shuffledOptions: opts,
          isCorrect: null
        });
        return opts;
      }

      function updateStats() {
        const total = activePool.length;
        let answered = 0;
        let correct = 0;

        for (const qObj of activePool) {
          const rec = answersMap.get(qObj.id);
          if (rec && rec.chosenText !== null) {
            answered++;
            if (rec.isCorrect) correct++;
          }
        }

        const acc = answered > 0 ? Math.round((correct / answered) * 100) : 0;
        const posDisplay = total === 0 ? "0 / 0" : `${Math.min(currentIndex + 1, total)} / ${total}`;

        elTotalBadge.textContent = `${total} pytań`;
        elPosText.textContent = posDisplay;
        elAnsweredText.textContent = `${answered} / ${total}`;
        elCorrectText.textContent = `${correct}`;
        elAccuracyText.textContent = `${acc}%`;

        const pct = total > 0 ? Math.round((answered / total) * 100) : 0;
        elProgressBar.style.width = `${pct}%`;
      }

      function handleSelectOption(qObj, chosenText) {
        const currentRec = answersMap.get(qObj.id) || {
          shuffledOptions: shuffleArray([qObj.correct, ...qObj.distractors])
        };
        if (currentRec.chosenText !== null) return;

        const isCorrect = chosenText === qObj.correct;
        answersMap.set(qObj.id, {
          ...currentRec,
          chosenText,
          isCorrect
        });
        render();
      }

      function renderSummary() {
        let correct = 0;
        for (const qObj of activePool) {
          const rec = answersMap.get(qObj.id);
          if (rec && rec.isCorrect) correct++;
        }
        const total = activePool.length;
        const pct = total > 0 ? Math.round((correct / total) * 100) : 0;

        elCard.innerHTML = `
          <div class="rt-summary">
            <h2>Podsumowanie rundy</h2>
            <p>Ukończono wszystkie pytania z wybranego zakresu.</p>
            <div class="rt-summary-score">${correct} / ${total} (${pct}%)</div>
            <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
              <button class="rt-btn" type="button" id="rtBackToFirstBtn">Wróć do pytania 1</button>
              <button class="rt-btn primary" type="button" id="rtSummaryRestartBtn">Zagraj ponownie (nowe losowanie)</button>
            </div>
          </div>
        `;

        document.getElementById("rtBackToFirstBtn").addEventListener("click", () => {
          currentIndex = 0;
          render();
        });
        document.getElementById("rtSummaryRestartBtn").addEventListener("click", () => {
          startNewRound(true);
        });
      }

      function render() {
        updateStats();

        if (currentIndex >= activePool.length) {
          renderSummary();
          return;
        }

        const qObj = activePool[currentIndex];
        const options = getOrCreateShuffledOptions(qObj);
        const rec = answersMap.get(qObj.id);
        const answered = rec && rec.chosenText !== null;

        elCard.innerHTML = "";

        const meta = document.createElement("div");
        meta.className = "rt-meta";
        meta.innerHTML = `
          <span><strong>${qObj.section}</strong> • Pytanie #${qObj.id}</span>
          <span>Pozycja ${currentIndex + 1} z ${activePool.length}</span>
        `;
        elCard.appendChild(meta);

        const qEl = document.createElement("p");
        qEl.className = "rt-question";
        qEl.textContent = qObj.q;
        elCard.appendChild(qEl);

        const optsWrap = document.createElement("div");
        optsWrap.className = "rt-options";

        options.forEach((optText, idx) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "rt-option";

          if (answered) {
            btn.disabled = true;
            if (optText === qObj.correct) {
              btn.classList.add("correct");
            } else if (optText === rec.chosenText && !rec.isCorrect) {
              btn.classList.add("wrong");
            } else {
              btn.classList.add("dimmed");
            }
          } else {
            btn.addEventListener("click", () => handleSelectOption(qObj, optText));
          }

          const keySpan = document.createElement("span");
          keySpan.className = "rt-opt-key";
          keySpan.textContent = LETTERS[idx] || String(idx + 1);

          const textSpan = document.createElement("span");
          textSpan.textContent = optText;

          btn.appendChild(keySpan);
          btn.appendChild(textSpan);
          optsWrap.appendChild(btn);
        });

        elCard.appendChild(optsWrap);

        const fbEl = document.createElement("div");
        fbEl.className = "rt-feedback";
        if (answered) {
          fbEl.classList.add("show", rec.isCorrect ? "ok" : "bad");
          fbEl.innerHTML = `
            <div class="rt-feedback-title">${
              rec.isCorrect ? "Prawidłowa odpowiedź!" : "Nieprawidłowa odpowiedź."
            }</div>
            <p class="rt-explanation">${qObj.explanation}</p>
          `;
        }
        elCard.appendChild(fbEl);

        const navEl = document.createElement("div");
        navEl.className = "rt-footer-nav";

        const prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.className = "rt-btn";
        prevBtn.textContent = "Poprzednie";
        prevBtn.disabled = currentIndex === 0;
        prevBtn.addEventListener("click", () => {
          if (currentIndex > 0) {
            currentIndex--;
            render();
          }
        });

        const nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.className = "rt-btn primary";
        nextBtn.textContent = currentIndex === activePool.length - 1 ? "Podsumowanie" : "Następne";
        nextBtn.addEventListener("click", () => {
          currentIndex++;
          render();
        });

        navEl.appendChild(prevBtn);
        navEl.appendChild(nextBtn);
        elCard.appendChild(navEl);
      }

      elSectionSelect.addEventListener("change", () => startNewRound(false));
      elShuffleQuestionsBtn.addEventListener("click", () => startNewRound(true));
      elRestartBtn.addEventListener("click", () => startNewRound(false));

      startNewRound(false);
    })();
  </script>
</body>
</html>
